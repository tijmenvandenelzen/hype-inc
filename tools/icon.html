<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&display=swap">
<style>
html,body{margin:0;background:#0a1424}
.i{width:512px;height:512px;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 40%,#16304f,#0a1424 70%)}
.dots{position:absolute;inset:0;background-image:radial-gradient(circle,#2a3c56 4px,transparent 5px);background-size:22px 22px;opacity:.9}
.b{position:absolute;left:50%;top:50%;width:300px;height:300px;margin:-150px 0 0 -150px;border-radius:50%;
background:radial-gradient(circle at 35% 30%,#ffd9a8,#ff8a1f 50%,#d55f00);box-shadow:0 0 80px #ff8a1f}
.t{position:absolute;inset:0;display:grid;place-items:center;font:180px/1 Bungee,"Arial Black",sans-serif;color:#0a1424;padding-top:10px}
.mask .b{width:240px;height:240px;margin:-120px 0 0 -120px}.mask .t{font-size:140px}
</style></head><body><div class="i" id="icon"><div class="dots"></div><div class="b"></div><div class="t">H</div></div></body></html>
